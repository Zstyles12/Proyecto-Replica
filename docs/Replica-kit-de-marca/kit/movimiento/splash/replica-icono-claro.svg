<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 0.5 105.5 115" width="105.5" height="115">
<title>Replica</title>
<style>.r-ribbon{transform-box:fill-box;transform-origin:50% 0}.r-flower,.r-flowerI{transform-box:fill-box;transform-origin:50% 50%}
@keyframes r-page{0%{opacity:0;transform:translate(0px, 6px);animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{opacity:1;transform:translate(0px, 0px)}}
 .r-page{animation:r-page 380ms linear 0ms both}
@keyframes r-hole0{0%{opacity:0;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{opacity:1}}
 .r-hole0{animation:r-hole0 200ms linear 180ms both}
@keyframes r-ring0{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{stroke-dashoffset:0}}
 .r-ring0{animation:r-ring0 320ms linear 200ms both}
@keyframes r-hole1{0%{opacity:0;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{opacity:1}}
 .r-hole1{animation:r-hole1 200ms linear 240ms both}
@keyframes r-ring1{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{stroke-dashoffset:0}}
 .r-ring1{animation:r-ring1 320ms linear 260ms both}
@keyframes r-hole2{0%{opacity:0;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{opacity:1}}
 .r-hole2{animation:r-hole2 200ms linear 300ms both}
@keyframes r-ring2{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{stroke-dashoffset:0}}
 .r-ring2{animation:r-ring2 320ms linear 320ms both}
@keyframes r-hole3{0%{opacity:0;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{opacity:1}}
 .r-hole3{animation:r-hole3 200ms linear 360ms both}
@keyframes r-ring3{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{stroke-dashoffset:0}}
 .r-ring3{animation:r-ring3 320ms linear 380ms both}
@keyframes r-hole4{0%{opacity:0;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{opacity:1}}
 .r-hole4{animation:r-hole4 200ms linear 420ms both}
@keyframes r-ring4{0%{stroke-dashoffset:100;animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}100%{stroke-dashoffset:0}}
 .r-ring4{animation:r-ring4 320ms linear 440ms both}
@keyframes r-ribbon{0%{transform:scaleY(0);animation-timing-function:cubic-bezier(0.34, 1.3, 0.64, 1)}100%{transform:scaleY(1)}}
 .r-ribbon{animation:r-ribbon 380ms linear 620ms both}
@keyframes r-flower{0%{opacity:0;transform:scale(0.2) rotate(-40deg);animation-timing-function:cubic-bezier(0.23, 1, 0.32, 1)}60%{opacity:1}100%{transform:scale(1) rotate(0deg)}}
 .r-flower{animation:r-flower 640ms linear 800ms both}
@keyframes r-fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){ .r-page, .r-hole0, .r-ring0, .r-hole1, .r-ring1, .r-hole2, .r-ring2, .r-hole3, .r-ring3, .r-hole4, .r-ring4, .r-ribbon, .r-flower{animation:r-fade 400ms linear both!important} .r-thread{animation:none!important}}
</style>
